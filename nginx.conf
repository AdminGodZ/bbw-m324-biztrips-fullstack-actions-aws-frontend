server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container / ALB health check
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }

    # Build metadata (version from the Git tag) - used to verify a deployment
    location = /version.json { expires -1; }
    location = /config.js { expires -1; }
    location = /index.html { expires -1; }
    location /assets/ { expires 1y; }

    # Same-origin API proxy for Docker Compose (VITE_API_BASE_URL="/").
    # Resolved per request (not at start-up): nginx starts and serves /health even while the backend is down.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $backend_origin ${BACKEND_ORIGIN};
    location /v1/ { proxy_pass $backend_origin; }
    location /actuator/ { proxy_pass $backend_origin; }

    location / { try_files $uri $uri/ /index.html; }
}
